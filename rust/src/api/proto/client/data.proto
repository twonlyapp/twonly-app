syntax = "proto3";

message SharedContact {
    int64 user_id = 1;
    bytes public_identity_key = 2;
    string display_name = 3;
}

message AdditionalMessageData {
    enum Type {
        LINK = 0;
        CONTACTS = 1;
        RESTORED_FLAME_COUNTER = 2;
        ASK_ABOUT_USER = 3;
        WEBXDC_APP = 4;
        WEBXDC_UPDATE = 5;
        WEBXDC_SENT = 6;
        WEBXDC_SYNC = 7;
        WEBXDC_SYNC_REQUEST = 8;
    }
    Type type = 1;

    optional string link = 2;
    repeated SharedContact contacts = 3;
    optional int64 restored_flame_counter = 4;
    optional int64 ask_about_user_id = 5;
    optional WebxdcApp webxdc_app = 6;
    optional WebxdcUpdate webxdc_update = 7;
    optional WebxdcOrigin webxdc_origin = 8;
    optional WebxdcSyncChunk webxdc_sync = 9;
    optional WebxdcSyncRequest webxdc_sync_request = 10;
}

// A peer-to-peer transfer of existing one-time app state. The encoded payload
// is split into bounded hidden messages and installed only after every chunk
// arrived and the digest matches.
message WebxdcSyncChunk {
    string transfer_id = 1;
    uint32 chunk_index = 2;
    uint32 chunk_count = 3;
    bytes payload_sha256 = 4;
    bytes payload = 5;
}

message WebxdcSyncRequest {}

message WebxdcSyncPayload {
    repeated WebxdcSyncInstance instances = 1;
}

message WebxdcSyncInstance {
    string instance_id = 1;
    string app_id = 2;
    int64 version = 3;
    optional string summary = 4;
    optional string document = 5;
    int64 created_at = 6;
    int64 last_update_at = 7;
    repeated WebxdcSyncUpdate updates = 8;
}

message WebxdcSyncUpdate {
    string message_id = 1;
    optional int64 sender_id = 2;
    string payload = 3;
    optional string info = 4;
    optional string href = 5;
    int64 received_at = 6;
}

// Attached to a message a webxdc app asked the user to send, so the chat can
// say which app it came from.
//
// `instance_id` is the app card in the chat the app runs in, which is not
// necessarily the chat this message was sent to: the user picks the recipient.
// `app_id` and `version` are carried as well so the receiver can name and
// picture the app even when it has no instance of its own.
message WebxdcOrigin {
    string instance_id = 1;
    string app_id      = 2;
    int64  version     = 3;
}

// The app itself is never sent. Peers resolve the id and version against the
// twonly store and download the bundle from the API server, so a sender can
// only point at code that has already been published.
message WebxdcApp {
    string app_id  = 1;
    int64  version = 2;
}

message WebxdcUpdate {
    // The message id of the app card this update belongs to.
    string          instance_id = 1;
    // JSON, as the app produced it. Never parsed by twonly.
    string          payload     = 2;
    optional string info        = 3;
    optional string href        = 4;
    optional string summary     = 5;
    optional string document    = 6;
    // JSON map of app-scoped member addresses to notification text.
    // Absent preserves legacy broadcast; an empty map notifies nobody.
    optional string notify      = 7;
}
