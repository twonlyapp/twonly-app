plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "eu.twonly"
    // compileSdk = flutter.compileSdkVersion
    compileSdk 36
    //ndkVersion = flutter.ndkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "eu.twonly"
        multiDexEnabled true
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [appName: "twonly"]
    }
    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        debug {
            applicationIdSuffix ".testing"
            manifestPlaceholders = [appName: "twonly [dev]"]
        }
        profile {
            // Profile builds are installed while profiling production-like
            // performance. They must never replace the store app.
            applicationIdSuffix ".testing"
            manifestPlaceholders = [appName: "twonly [profile]"]
        }
        release {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
       }
    }
}

flutter {
    source = "../.."
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
  implementation platform('com.google.firebase:firebase-bom:34.9.0')
  implementation 'com.google.firebase:firebase-messaging'
  implementation 'androidx.work:work-runtime:2.10.2'
  // Hardware video composition and transcoding: MediaCodec for decode/encode,
  // OpenGL for the overlay. Replaces both the software Flutter editor pass and
  // the previous third-party transcoder.
  implementation 'androidx.media3:media3-transformer:1.11.0'
  implementation 'androidx.media3:media3-effect:1.11.0'
  implementation 'androidx.media3:media3-common:1.11.0'
  implementation 'androidx.core:core-splashscreen:1.0.1'
  // Material 3 components for the native widget configuration screen.
  implementation 'com.google.android.material:material:1.13.0'
}
