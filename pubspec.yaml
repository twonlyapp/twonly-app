name: twonly
description: "twonly, a privacy-friendly way to connect with friends through secure, spontaneous image sharing."

publish_to: 'none'

version: 0.5.2+172

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
