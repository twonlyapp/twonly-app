dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.25.2
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  vector_graphics_compiler: ^1.2.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  very_good_analysis: ^10.0.0
  in_app_purchase_platform_interface: ^1.4.0
  integration_test:
    sdk: flutter
  workmanager_platform_interface: any

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_monochrome: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FF57CC99"

flutter:
  uses-material-design: true

  # config:
  #   enable-swift-package-manager: false

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/icons/
    - assets/icons/verification_badge_numeric/
    - assets/animated_icons/
    - assets/animations/
    - assets/filters/
    - assets/passwords/
    - CHANGELOG.md

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf


